{% extends "base.html" %}
{% block title %}تسجيل الدخول — أحلى طلة{% endblock %}
{% block head_extra %}
<style>
  body {
    background: radial-gradient(ellipse at top, #2C2624 0%, #1F1B1A 60%, #100D0C 100%);
    min-height: 100vh;
  }
  .login-shell {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: #fff; border-radius: 20px; box-shadow: 0 30px 60px rgba(0,0,0,.35);
    width: 100%; max-width: 420px; overflow: hidden;
  }
  .login-hero {
    background: linear-gradient(135deg, #E87722 0%, #C25E14 100%);
    padding: 32px 24px 40px; text-align: center; color: #fff;
  }
  .login-hero .logo-frame {
    width: 108px; height: 108px; margin: 0 auto 14px; background: #1F1B1A; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
  }
  .login-hero .logo-frame img { width: 78%; height: 78%; object-fit: contain; }
  .login-hero h2 { margin: 0; font-weight: 900; font-size: 26px; }
  .login-hero p { margin: 4px 0 0; opacity: .9; font-size: 13px; }

  .login-body { padding: 28px 28px 24px; }
  .login-body .form-label i { color: var(--brand); margin-inline-end: 4px; }

  .btn-brand {
    background: linear-gradient(135deg, #E87722, #C25E14);
    color: #fff; border: none; padding: 12px; font-weight: 700; letter-spacing: .5px;
    border-radius: 10px; width: 100%; box-shadow: 0 6px 16px rgba(232,119,34,.35);
  }
  .btn-brand:hover { color: #fff; filter: brightness(1.05); }
</style>
{% endblock %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-hero">
      <div class="logo-frame"><img src="/static/brand/logo.png" alt="أحلى طلة"></div>
      <h2>أحلى طلة</h2>
      <p>لوحة التحكم — مرحباً بعودتك</p>
    </div>
    <div class="login-body">
      <form method="post">
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope"></i> البريد الإلكتروني</label>
          <input name="email" type="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock"></i> كلمة المرور</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <button class="btn-brand"><i class="bi bi-box-arrow-in-right"></i> دخول</button>
      </form>
      <p class="text-center text-muted mt-3 mb-0" style="font-size: 12px;">
        دخول للطاقم فقط — لأي مشكلة تواصل مع الإدارة.
      </p>
    </div>
  </div>
</div>
{% endblock %}
